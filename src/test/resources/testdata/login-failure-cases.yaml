loginFailureCases:
  - scenario: "用户名为空"
    request:
      username: ""
      password: "123456"
    expected:
      httpStatus: 400
      businessCode: 1002
      message: "用户名不能为空"

  - scenario: "用户名全是空格"
    request:
      username: "   "
      password: "123456"
    expected:
      httpStatus: 400
      businessCode: 1002
      message: "用户名不能为空"

  - scenario: "密码为空"
    request:
      username: "admin"
      password: ""
    expected:
      httpStatus: 400
      businessCode: 1003
      message: "密码不能为空"

  - scenario: "密码错误"
    request:
      username: "admin"
      password: "wrong-password"
    expected:
      httpStatus: 401
      businessCode: 1001
      message: "用户名或密码错误"

  - scenario: "用户不存在"
    request:
      username: "unknown-user"
      password: "123456"
    expected:
      httpStatus: 401
      businessCode: 1001
      message: "用户名或密码错误"

  - scenario: "密码全是空格"
    request:
      username: "admin"
      password: "   "
    expected:
      httpStatus: 400
      businessCode: 1003
      message: "密码不能为空"
